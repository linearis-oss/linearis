name: CI

on:
  push:
    branches: 
      - main
  pull_request:
    types: 
      - opened
      - synchronize
      - ready_for_review
      - reopened

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests on node v${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup node v${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run unit tests
        run: npm test

  lint:
    strategy:
      matrix:
        node-version: [22, 24]

    name: Code checks on node v${{ matrix.node-version }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup node v${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Biome check
        run: npm run check:ci

      - name: TypeScript type check
        run: npx tsc --noEmit

  smoke-test:
    name: Smoke test package install
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Pack and install
        run: |
          npm pack
          npm install -g ./linearis-*.tgz
          linearis --help
          npm uninstall -g linearis
