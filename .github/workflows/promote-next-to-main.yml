name: Promote next to main

on:
  push:
    branches:
      - next
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-next-to-main
  cancel-in-progress: true

jobs:
  promote:
    if: ${{ github.event_name != 'release' || (github.event.release.prerelease == true && github.event.release.target_commitish == 'next') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: next
          fetch-depth: 0

      - name: Fetch main and next refs
        run: git fetch origin main next

      - name: Generate linearis-bot app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Build PR metadata
        id: meta
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          version=$(node -p "require('./package.json').version.replace(/-next\\.\\d+$/, '')")
          title="release ${version} to stable channel"
          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...next"
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"

          mapfile -t commit_shas < <(git rev-list --no-merges origin/main..origin/next)

          declare -A seen_prs=()
          included_prs=""

          for sha in "${commit_shas[@]}"; do
            response=$(gh api graphql \
              -f owner="$owner" \
              -f repo="$repo" \
              -f oid="$sha" \
              -f query='query($owner: String!, $repo: String!, $oid: GitObjectID!) { repository(owner: $owner, name: $repo) { object(oid: $oid) { ... on Commit { associatedPullRequests(first: 10) { nodes { number title url author { login } } } } } } }' \
              2>/dev/null || true)

            if [ -z "$response" ]; then
              continue
            fi

            while IFS=$'\t' read -r number pr_title pr_url pr_author; do
              if [ -z "$number" ] || [ -n "${seen_prs[$number]:-}" ]; then
                continue
              fi

              seen_prs[$number]=1

              if [ -z "$pr_author" ] || [ "$pr_author" = "null" ]; then
                pr_author="unknown"
              fi

              included_prs+="- [#${number}](${pr_url}) ${pr_title} by @${pr_author} — thanks @${pr_author}!\n"
            done < <(printf '%s' "$response" | jq -r '.data.repository.object.associatedPullRequests.nodes[]? | [.number, .title, .url, .author.login] | @tsv')
          done

          if [ -z "$included_prs" ]; then
            included_prs="- (no included pull requests found; branches may be aligned)"
          fi

          {
            echo "title=$title"
            echo "version=$version"
            echo "compare_url=$compare_url"
            echo "body<<EOF"
            echo "## Purpose"
            echo "Promote tested prerelease changes from \`next\` into stable channel on \`main\`."
            echo
            echo "## Target stable version"
            echo "\`$version\`"
            echo
            echo "## Included pull requests (next ahead of main)"
            printf '%b\n' "$included_prs"
            echo
            echo "## Compare"
            echo "$compare_url"
            echo
            echo "## Notes"
            echo "- This PR is auto-maintained on every push to \`next\`."
            echo "- Merge this PR to promote current prerelease train to stable."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upsert promotion PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          existing=$(gh pr list \
            --state open \
            --base main \
            --head next \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh pr edit "$existing" \
              --title "${{ steps.meta.outputs.title }}" \
              --body "${{ steps.meta.outputs.body }}"
            echo "Updated PR #$existing"
          else
            gh pr create \
              --base main \
              --head next \
              --title "${{ steps.meta.outputs.title }}" \
              --body "${{ steps.meta.outputs.body }}"
            echo "Created promotion PR"
          fi
