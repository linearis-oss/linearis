name: Promote Next to Main

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-next-to-main
  cancel-in-progress: true

jobs:
  promote:
    name: Promote Next to Main
    if: ${{ github.event_name != 'release' || (github.event.release.prerelease == true && github.event.release.target_commitish == 'next') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: next
          fetch-depth: 0

      - name: Fetch main and next refs
        run: git fetch origin main next

      - name: No-op when next has no commits ahead of main
        id: commits-check
        shell: bash
        run: |
          set -euo pipefail

          commit_ahead=$(git rev-list --max-count=1 origin/main..origin/next)

          if [ -z "$commit_ahead" ]; then
            echo "No commits to promote (origin/main..origin/next is empty)."
            echo "has_commits=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_commits=true" >> "$GITHUB_OUTPUT"

      - name: Generate linearis-bot app token
        if: ${{ steps.commits-check.outputs.has_commits == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Build PR metadata
        if: ${{ steps.commits-check.outputs.has_commits == 'true' }}
        id: meta
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          version=$(node -p "require('./package.json').version.replace(/-next\\.\\d+$/, '')")
          title="release ${version} to stable channel"
          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...next"
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"

          mapfile -t commit_shas < <(git rev-list --no-merges origin/main..origin/next)

          classify_commit() {
            local subject="$1"
            local body="$2"

            local type=""
            local scope=""
            local bang=""

            local conventional_re='^([a-z]+)(\(([^()]*)\))?(!)?:[[:space:]]'
            if [[ "$subject" =~ $conventional_re ]]; then
              type="${BASH_REMATCH[1]}"
              scope="${BASH_REMATCH[3]:-}"
              bang="${BASH_REMATCH[4]:-}"
            fi

            if [ "$bang" = "!" ] || grep -q "BREAKING CHANGE:" <<<"$body"; then
              echo "releasable"
              return
            fi

            case "$type" in
              feat|fix|perf|revert)
                ;;
              *)
                echo "maintenance"
                return
                ;;
            esac

            case "$scope" in
              ci|release|workflow)
                echo "maintenance"
                ;;
              *)
                echo "releasable"
                ;;
            esac
          }

          declare -A seen_prs=()
          declare -A pr_releasable=()
          declare -A pr_titles=()
          declare -A pr_urls=()
          declare -A pr_authors=()

          releasable_commits_no_pr=""
          maintenance_commits_no_pr=""

          for sha in "${commit_shas[@]}"; do
            subject=$(git show -s --format=%s "$sha")
            body=$(git show -s --format=%B "$sha")
            class=$(classify_commit "$subject" "$body")

            response=$(gh api graphql \
              -f owner="$owner" \
              -f repo="$repo" \
              -f oid="$sha" \
              -f query='query($owner: String!, $repo: String!, $oid: GitObjectID!) { repository(owner: $owner, name: $repo) { object(oid: $oid) { ... on Commit { associatedPullRequests(first: 10) { nodes { number title url author { login } } } } } } }' \
              2>/dev/null || true)

            has_pr=false
            if [ -n "$response" ]; then
              while IFS=$'\t' read -r number pr_title pr_url pr_author; do
                if [ -z "$number" ]; then
                  continue
                fi

                has_pr=true
                seen_prs[$number]=1

                if [ -z "$pr_author" ] || [ "$pr_author" = "null" ]; then
                  pr_author="unknown"
                fi

                pr_titles[$number]="$pr_title"
                pr_urls[$number]="$pr_url"
                pr_authors[$number]="$pr_author"

                if [ "$class" = "releasable" ]; then
                  pr_releasable[$number]=1
                fi
              done < <(printf '%s' "$response" | jq -r '.data.repository.object.associatedPullRequests.nodes[]? | [.number, .title, .url, .author.login] | @tsv')
            fi

            if [ "$has_pr" = false ]; then
              if [ "$class" = "releasable" ]; then
                releasable_commits_no_pr+="- ${subject} (${sha:0:7})\n"
              else
                maintenance_commits_no_pr+="- ${subject} (${sha:0:7})\n"
              fi
            fi
          done

          releasable_prs=""
          maintenance_prs=""

          if [ ${#seen_prs[@]} -gt 0 ]; then
            while IFS= read -r number; do
              pr_title="${pr_titles[$number]}"
              pr_url="${pr_urls[$number]}"
              pr_author="${pr_authors[$number]}"

              line="- [#${number}](${pr_url}) ${pr_title} by @${pr_author}"

              if [ "${pr_releasable[$number]:-0}" = "1" ]; then
                releasable_prs+="${line}\n"
              else
                maintenance_prs+="${line}\n"
              fi
            done < <(printf '%s\n' "${!seen_prs[@]}" | sort -n)
          fi

          if [ -z "$releasable_prs" ] && [ -z "$releasable_commits_no_pr" ]; then
            releasable_prs="- None"
          fi

          if [ -z "$maintenance_prs" ] && [ -z "$maintenance_commits_no_pr" ]; then
            maintenance_prs="- None"
          fi

          {
            echo "title=$title"
            echo "version=$version"
            echo "compare_url=$compare_url"
            echo "body<<EOF"
            echo "## Purpose"
            echo "Promote tested prerelease changes from \`next\` into stable channel on \`main\`."
            echo
            echo "## Target stable version"
            echo "\`$version\`"
            echo
            echo "## Ships in stable (releasable changes)"
            printf '%b\n' "$releasable_prs"
            if [ -n "$releasable_commits_no_pr" ]; then
              echo
              echo "### Releasable commits without associated PR"
              printf '%b\n' "$releasable_commits_no_pr"
            fi
            echo
            echo "## Also included (no version impact)"
            printf '%b\n' "$maintenance_prs"
            if [ -n "$maintenance_commits_no_pr" ]; then
              echo
              echo "### Maintenance commits without associated PR"
              printf '%b\n' "$maintenance_commits_no_pr"
            fi
            echo
            echo "## Compare"
            echo "$compare_url"
            echo
            echo "## Notes"
            echo "- This PR is auto-maintained when a prerelease is published from \`next\`."
            echo "- Merge this PR to promote current prerelease train to stable."
            echo "- Releasable classification mirrors semantic-release policy (feat/fix/perf/revert plus breaking changes, excluding ci/release/workflow scopes)."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upsert promotion PR
        if: ${{ steps.commits-check.outputs.has_commits == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PROMOTION_PR_TITLE: ${{ steps.meta.outputs.title }}
          PROMOTION_PR_BODY: ${{ steps.meta.outputs.body }}
        shell: bash
        run: |
          set -euo pipefail

          body_file=$(mktemp)
          printf '%s\n' "$PROMOTION_PR_BODY" > "$body_file"

          existing=$(gh pr list \
            --state open \
            --base main \
            --head next \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh pr edit "$existing" \
              --title "$PROMOTION_PR_TITLE" \
              --body-file "$body_file"
            echo "Updated PR #$existing"
          else
            gh pr create \
              --base main \
              --head next \
              --title "$PROMOTION_PR_TITLE" \
              --body-file "$body_file"
            echo "Created promotion PR"
          fi
