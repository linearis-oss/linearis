name: Sync Main Back to Next

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: sync-main-release-back-to-next
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Main Back to Next
    if: ${{ github.event.release.prerelease == false && github.event.release.target_commitish == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout next
        uses: actions/checkout@v6
        with:
          ref: next
          fetch-depth: 0
          persist-credentials: false

      - name: Create linearis-bot app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Resolve linearis-bot app bot identity
        id: app-bot
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          slug='${{ steps.app-token.outputs.app-slug }}'
          id="$(gh api "/users/${slug}[bot]" --jq .id)"
          echo "name=${slug}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${slug}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Configure git (linearis-bot app identity)
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "${{ steps.app-bot.outputs.name }}"
          git config user.email "${{ steps.app-bot.outputs.email }}"

      - name: Merge main into next
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main next
          git checkout next

          if git merge --ff-only origin/main; then
            git push origin HEAD:next
            echo "Synced main release commit(s) back to next (fast-forward)"
            exit 0
          fi

          if git merge --no-ff origin/main -m "chore(sync): merge main release back into next"; then
            git push origin HEAD:next
            echo "Synced main release commit(s) back to next (merge commit)"
            exit 0
          fi

          echo "::error::Automatic merge main -> next failed. Resolve conflicts manually."
          exit 1
