# ------------------------------------------------------------
# Optimized GraphQL mutations for issue operations
#
# This module contains highly optimized GraphQL mutations that create
# and update issues with complete response data including all relationships.
# ------------------------------------------------------------

# Create issue mutation with complete response
#
# Creates a new issue and returns complete issue data including
# all relationships. Uses the comprehensive fragment to ensure
# consistent data structure with read operations.
mutation CreateIssue($input: IssueCreateInput!) {
  issueCreate(input: $input) {
    success
    issue {
      ...CompleteIssueWithDefaultCommentsFields
    }
  }
}

# Update issue mutation with complete response
#
# Updates an existing issue and returns complete issue data with
# all relationships. Ensures consistency between update and read
# operations by using the same fragment structure.
mutation UpdateIssue($id: String!, $input: IssueUpdateInput!) {
  issueUpdate(id: $id, input: $input) {
    success
    issue {
      ...CompleteIssueWithDefaultCommentsFields
    }
  }
}

mutation ArchiveIssue($id: String!) {
  issueArchive(id: $id) {
    success
    entity {
      ...CompleteIssueWithDefaultCommentsFields
    }
  }
}

mutation UnarchiveIssue($id: String!) {
  issueUnarchive(id: $id) {
    success
    entity {
      ...CompleteIssueWithDefaultCommentsFields
    }
  }
}

# Create many issues in one transaction
#
# The batch payload returns the created issues without the per-issue comment
# thread: a freshly created issue has no comments, and CompleteIssueFields
# keeps the response proportional to the batch size.
mutation BatchCreateIssues($input: IssueBatchCreateInput!) {
  issueBatchCreate(input: $input) {
    success
    issues {
      ...CompleteIssueFields
    }
  }
}

# Apply one patch to an explicit list of issues
mutation BatchUpdateIssues($ids: [UUID!]!, $input: IssueUpdateInput!) {
  issueBatchUpdate(ids: $ids, input: $input) {
    success
    issues {
      ...CompleteIssueFields
    }
  }
}

# Subscribe a user to an issue's notifications
#
# The API accepts either userId or userEmail; the CLI always resolves to a
# UUID first (resolvers own ID resolution), so only userId is threaded through.
mutation SubscribeToIssue($id: String!, $userId: String!) {
  issueSubscribe(id: $id, userId: $userId) {
    success
    issue {
      ...CompleteIssueWithDefaultCommentsFields
    }
  }
}

mutation UnsubscribeFromIssue($id: String!, $userId: String!) {
  issueUnsubscribe(id: $id, userId: $userId) {
    success
    issue {
      ...CompleteIssueWithDefaultCommentsFields
    }
  }
}

# Grant a user access to an issue they could not otherwise see
#
# Despite the name this does not mint a shareable link — the issue's own
# permalink is the `url` field on the read payload.
mutation ShareIssue($id: String!, $userId: String!) {
  issueShare(id: $id, userId: $userId) {
    success
    issue {
      ...CompleteIssueWithDefaultCommentsFields
    }
  }
}

mutation UnshareIssue($id: String!, $userId: String!) {
  issueUnshare(id: $id, userId: $userId) {
    success
    issue {
      ...CompleteIssueWithDefaultCommentsFields
    }
  }
}

# Schedule a reminder for the viewer on an issue
mutation RemindOnIssue($id: String!, $reminderAt: DateTime!) {
  issueReminder(id: $id, reminderAt: $reminderAt) {
    success
    issue {
      ...CompleteIssueWithDefaultCommentsFields
    }
  }
}

mutation DeleteIssue($id: String!) {
  issueDelete(id: $id) {
    success
    entity {
      id
    }
  }
}
