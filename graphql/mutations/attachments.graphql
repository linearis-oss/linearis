# ------------------------------------------------------------
# GraphQL mutations for Linear attachments
#
# Attachments allow linking any URL to an issue. This is the mechanism
# to associate documents (or any external resource) with issues, since
# documents cannot be directly linked to issues in Linear's data model.
#
# Key behavior: Attachments are idempotent - creating an attachment with
# the same url + issueId will update the existing attachment.
# ------------------------------------------------------------

# Create an attachment on an issue
#
# If an attachment with the same url and issueId already exists,
# the existing record is updated instead of creating a duplicate.
mutation AttachmentCreate($input: AttachmentCreateInput!) {
  attachmentCreate(input: $input) {
    success
    attachment {
      ...AttachmentFields
    }
  }
}

# Stop syncing an issue with the external resource behind an attachment
#
# Despite the `issue*` prefix the mutation is keyed by attachment, not issue:
# a single issue can carry several synced attachments and they are disabled
# one at a time. It returns the affected issue.
mutation AttachmentExternalSyncDisable($attachmentId: String!) {
  issueExternalSyncDisable(attachmentId: $attachmentId) {
    success
    issue {
      ...CompleteIssueFields
    }
  }
}

# Delete an attachment
#
# Deletes an attachment and returns success status.
mutation AttachmentDelete($id: String!) {
  attachmentDelete(id: $id) {
    success
    entityId
  }
}
