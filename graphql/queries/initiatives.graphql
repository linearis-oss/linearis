fragment InitiativeCoreFields on Initiative {
  id
  name
  description
  content
  targetDate
  sortOrder
  archivedAt
  createdAt
  updatedAt
  startedAt
  completedAt
  canceledAt
  health
  healthUpdatedAt
  status
  url
  creator {
    id
    name
  }
  owner {
    id
    name
  }
  team {
    id
    key
    name
  }
}

fragment InitiativeExpandedFields on Initiative {
  projects {
    nodes {
      id
      name
      slugId
    }
  }
  initiatives {
    nodes {
      id
      name
    }
  }
  parentInitiatives {
    nodes {
      id
      name
    }
  }
  updates {
    nodes {
      id
      title
      health
      createdAt
    }
  }
  links {
    nodes {
      id
      url
      title
    }
  }
  history {
    nodes {
      id
      createdAt
    }
  }
  documents {
    nodes {
      id
      title
    }
  }
}

fragment InitiativeUpdateCoreFields on InitiativeUpdate {
  id
  title
  body
  health
  createdAt
  updatedAt
  archivedAt
  initiative {
    id
    name
  }
  user {
    id
    name
  }
}

query ListInitiatives(
  $first: Int = 50
  $after: String
  $includeArchived: Boolean = false
  $filter: InitiativeFilter
  $orderBy: InitiativeSortInput
) {
  initiatives(
    first: $first
    after: $after
    includeArchived: $includeArchived
    filter: $filter
    orderBy: $orderBy
  ) {
    nodes {
      ...InitiativeCoreFields
      ...InitiativeExpandedFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query GetInitiative($id: String!) {
  initiative(id: $id) {
    ...InitiativeCoreFields
    ...InitiativeExpandedFields
  }
}

query ListInitiativeUpdates(
  $initiativeId: String!
  $first: Int = 50
  $after: String
  $includeArchived: Boolean = false
) {
  initiativeUpdates(
    first: $first
    after: $after
    includeArchived: $includeArchived
    filter: { initiative: { id: { eq: $initiativeId } } }
  ) {
    nodes {
      ...InitiativeUpdateCoreFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query GetInitiativeUpdate($id: String!) {
  initiativeUpdate(id: $id) {
    ...InitiativeUpdateCoreFields
  }
}

query FindInitiativesByName($name: String!, $teamId: String, $ownerId: String) {
  initiatives(
    first: 20
    filter: {
      and: [
        { name: { eqIgnoreCase: $name } }
        { team: { id: { eq: $teamId } } }
        { owner: { id: { eq: $ownerId } } }
      ]
    }
  ) {
    nodes {
      id
      name
      team {
        id
        key
        name
      }
      owner {
        id
        name
      }
    }
  }
}

query FindInitiativeRelationByPair($parentId: String!, $childId: String!) {
  initiativeRelations(
    first: 1
    filter: {
      and: [
        { parent: { id: { eq: $parentId } } }
        { initiative: { id: { eq: $childId } } }
      ]
    }
  ) {
    nodes {
      id
    }
  }
}

query FindInitiativeProjectLinkByPair(
  $initiativeId: String!
  $projectId: String!
) {
  initiativeToProjects(
    first: 1
    filter: {
      and: [
        { initiative: { id: { eq: $initiativeId } } }
        { project: { id: { eq: $projectId } } }
      ]
    }
  ) {
    nodes {
      id
    }
  }
}
