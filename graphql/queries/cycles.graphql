# ------------------------------------------------------------
# GraphQL queries and mutations for Linear cycles
#
# Cycles are sprint/event containers within teams. They can be
# queried by name (global or team-scoped), and are associated
# with issues and teams.
# ------------------------------------------------------------

fragment CycleFields on Cycle {
  id
  number
  name
  startsAt
  endsAt
  isActive
  isNext
  isPrevious
}

fragment CycleWithIssuesFields on Cycle {
  ...CycleFields
  issues(first: $first) {
    nodes {
      id
      identifier
      title
      state {
        name
      }
    }
  }
}

# List cycles with optional filtering
query GetCycles($first: Int = 50, $filter: CycleFilter) {
  cycles(first: $first, filter: $filter) {
    nodes {
      ...CycleFields
    }
  }
}

# Get cycle by ID with issues
query GetCycleById($id: String!, $first: Int = 50) {
  cycle(id: $id) {
    ...CycleWithIssuesFields
  }
}

# Find a cycle by name and team ID
query FindCycleScoped($name: String!, $teamId: ID!) {
  cycles(
    filter: {
      and: [{ name: { eq: $name } }, { team: { id: { eq: $teamId } } }]
    }
    first: 10
  ) {
    nodes {
      id
      name
      number
      startsAt
      isActive
      isNext
      isPrevious
      team {
        id
        key
      }
    }
  }
}

# Find a cycle by name
query FindCycleGlobal($name: String!) {
  cycles(filter: { name: { eq: $name } }, first: 10) {
    nodes {
      id
      name
      number
      startsAt
      isActive
      isNext
      isPrevious
      team {
        id
        key
      }
    }
  }
}
