query BatchResolveIssueLabelsPage($first: Int!, $after: String) {
  issueLabels(first: $first, after: $after) {
    nodes {
      id
      name
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query BatchResolveWorkflowStatesPage($first: Int!, $after: String) {
  workflowStates(first: $first, after: $after) {
    nodes {
      id
      name
      team {
        id
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Find workflow states by a dynamic filter for status ID resolution
#
# The filter is supplied by the caller (name plus optional team scope)
# so the unscoped case omits the team clause entirely rather than
# filtering on a null team id. Emits the WorkflowStateFilter input type.
query FindWorkflowStates($filter: WorkflowStateFilter, $first: Int = 1) {
  workflowStates(filter: $filter, first: $first) {
    nodes {
      id
    }
  }
}

# Find issues by a dynamic filter for ID resolution
#
# The filter is supplied by the caller so the resolver can preserve both the
# UUID lookup ({ id: { eq } }) and the identifier lookup
# ({ number: { eq }, team: { key: { eq } } }). team { id key } is selected so
# the estimate-context resolver can derive the owning team without a second
# round-trip.
#
# includeArchived is fixed to true: this query exists purely to turn a human
# identifier into a UUID, and an archived issue still has one. Without it
# `issues unarchive ENG-42` could never work, because the identifier could not
# be resolved in the first place.
query FindIssues($filter: IssueFilter, $first: Int = 1) {
  issues(filter: $filter, first: $first, includeArchived: true) {
    nodes {
      id
      number
      team {
        id
        key
      }
    }
  }
}

# Find the issue a VCS branch belongs to
#
# Linear derives a branch name per issue (the `branchName` field), and this is
# the reverse lookup. Returns null when the branch is not one of Linear's.
query IssueVcsBranchSearch($branchName: String!) {
  issueVcsBranchSearch(branchName: $branchName) {
    ...CompleteIssueWithDefaultCommentsFields
  }
}

# Complete issue fragment with attachments
fragment CompleteIssueWithAttachmentsFields on Issue {
  ...CompleteIssueWithDefaultCommentsFields
  attachments {
    nodes {
      ...AttachmentFields
    }
  }
}

# Get single issue by UUID with attachments
query GetIssueByIdWithAttachments($id: String!) {
  issue(id: $id) {
    ...CompleteIssueWithAttachmentsFields
  }
}

# Get issue by identifier with attachments
query GetIssueByIdentifierWithAttachments($teamKey: String!, $number: Float!) {
  issues(
    filter: { team: { key: { eq: $teamKey } }, number: { eq: $number } }
    first: 1
    includeArchived: true
  ) {
    nodes {
      ...CompleteIssueWithAttachmentsFields
    }
  }
}
