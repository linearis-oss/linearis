# ------------------------------------------------------------
# Optimized GraphQL queries for issue operations
#
# This module contains highly optimized GraphQL queries that fetch
# all necessary issue data in single requests, eliminating N+1 query
# problem common with Linear SDK. Each query uses comprehensive
# fragments to ensure consistent data structures.
# ------------------------------------------------------------

# Complete issue fragment with all relationships
#
# Combines all issue fragments into a comprehensive field selection.
# This is used when full issue details are needed including all
# relationships (state, assignee, team, project, labels, comments).
fragment CompleteIssueFields on Issue {
  id
  identifier
  title
  description
  url
  branchName
  priority
  estimate
  dueDate
  createdAt
  updatedAt
  startedAt
  completedAt
  canceledAt
  archivedAt
  snoozedUntilAt
  trashed
  state {
    id
    name
  }
  creator {
    id
    name
  }
  assignee {
    id
    name
  }
  delegate {
    id
    name
  }
  team {
    id
    key
    name
  }
  project {
    id
    name
  }
  labels {
    nodes {
      id
      name
    }
  }
  cycle {
    id
    name
    number
  }
  projectMilestone {
    id
    name
    targetDate
  }
  parent {
    id
    identifier
    title
  }
  children {
    nodes {
      id
      identifier
      title
    }
  }
  relations {
    nodes {
      id
      type
      relatedIssue {
        id
        identifier
      }
    }
  }
  inverseRelations {
    nodes {
      id
      type
      issue {
        id
        identifier
      }
    }
  }
}

# Per-issue detail that is deliberately absent from CompleteIssueFields
#
# A subscriber roster and a sharing summary are worth one round-trip when the
# caller asked for one issue, but they would multiply across every row of a
# 50-issue list for no benefit — so they hang off the single-read fragments
# only, not off the shared list fragment.
fragment IssueDetailOnlyFields on Issue {
  subscribers {
    nodes {
      id
      name
    }
  }
  sharedAccess {
    isShared
    sharedWithCount
    viewerHasOnlySharedAccess
  }
}

# Minimal comment fields preserved for default issue reads
fragment IssueReadDefaultCommentFields on Comment {
  id
  body
}

# Comment fields for issue read discussion expansion
fragment IssueReadCommentFields on Comment {
  id
  body
  createdAt
  editedAt
  parentId
  user {
    id
    displayName
  }
}

# Complete issue fragment with all relationships and default comments
#
# Preserves the historical issue read payload while keeping richer
# discussion metadata behind explicit flags.
fragment CompleteIssueWithDefaultCommentsFields on Issue {
  ...CompleteIssueFields
  ...IssueDetailOnlyFields
  comments {
    nodes {
      ...IssueReadDefaultCommentFields
    }
  }
}

# Complete issue fragment with all relationships and comments
#
# Combines all issue fragments into a comprehensive field selection.
# This is used when full issue details are needed including all
# relationships (state, assignee, team, project, labels, comments).
fragment CompleteIssueWithCommentsFields on Issue {
  ...CompleteIssueFields
  ...IssueDetailOnlyFields
  comments {
    nodes {
      ...IssueReadCommentFields
    }
  }
}

# Complete issue fragment with all relationships, default comments, and reactions
fragment CompleteIssueWithReactionsFields on Issue {
  ...CompleteIssueWithDefaultCommentsFields
  reactions {
    ...ReactionReadFields
  }
}

