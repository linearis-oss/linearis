# ------------------------------------------------------------
# GraphQL queries for Linear projects
#
# Projects group related issues across teams toward a common goal.
# Each project has a status (backlog, planned, started, paused,
# completed, canceled), optional target date, and can contain milestones.
# Projects are workspace-level and can span multiple teams.
# ------------------------------------------------------------

# Project list fields fragment
#
# Fields returned for each project in list results. Includes status,
# priority, lead, teams, labels, health, and progress for rich output.
# Retains deprecated `state` field for backward compatibility.
fragment ProjectListFields on Project {
  id
  name
  description
  state
  status {
    id
    name
    type
  }
  slugId
  priority
  priorityLabel
  health
  progress
  startDate
  targetDate
  url
  lead {
    id
    name
  }
  teams {
    nodes {
      id
      key
      name
    }
  }
  labels {
    nodes {
      id
      name
      color
    }
  }
}

# Project detail fields fragment
#
# Extended fields for single-project read view. Includes content,
# members, milestones, initiatives, creator, lifecycle dates, and
# visual properties.
fragment ProjectDetailFields on Project {
  ...ProjectListFields
  content
  icon
  color
  createdAt
  updatedAt
  startedAt
  completedAt
  canceledAt
  creator {
    id
    name
  }
  members {
    nodes {
      id
      name
    }
  }
  projectMilestones {
    nodes {
      id
      name
      targetDate
    }
  }
  initiatives {
    nodes {
      id
      name
    }
  }
}

# List all projects in the workspace
#
# Fetches a paginated list of projects across all teams with enriched
# fields including status, priority, lead, teams, labels, health.
#
# Variables:
#   $first: Maximum number of projects to return (default: 50)
#   $after: Cursor for pagination
query GetProjects($first: Int = 50, $after: String) {
  projects(first: $first, after: $after) {
    nodes {
      ...ProjectListFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Project detail fields for opt-in reaction-aware reads
#
# Root project reactions are intentionally unsupported by the current schema.
# Keep the opt-in variant explicit for callers without changing the core
# project contract. Only paginated root discussion comments are included here
# with reactions and pageInfo. Replies are intentionally excluded and must be
# fetched via the dedicated project discussion queries.
fragment ProjectDetailFieldsWithReactions on Project {
  ...ProjectDetailFields
  comments(first: $first, after: $after, filter: { parent: { null: true } }) {
    nodes {
      ...DiscussionCommentFieldsWithReactions
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Get a single project by ID
#
# Fetches complete project details including content, members,
# milestones, initiatives, and lifecycle timestamps.
#
# Variables:
#   $id: Project UUID
query GetProject($id: String!) {
  project(id: $id) {
    ...ProjectDetailFields
  }
}

# Get a single project by ID for opt-in reaction-aware reads
#
# Includes only paginated root discussion comments with reactions. Replies are
# intentionally excluded here and must come from dedicated discussion queries.
query GetProjectWithReactions($id: String!, $first: Int, $after: String) {
  project(id: $id) {
    ...ProjectDetailFieldsWithReactions
  }
}

# List all project statuses in the workspace
#
# Fetches project statuses for name-to-UUID resolution.
# The API does not support filter args on this connection,
# so all statuses are fetched and filtered client-side.
query GetProjectStatuses {
  projectStatuses {
    nodes {
      id
      name
    }
  }
}
