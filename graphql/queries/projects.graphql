# ------------------------------------------------------------
# GraphQL queries for Linear projects
#
# Projects group related issues across teams toward a common goal.
# Each project has a status (backlog, planned, started, paused,
# completed, canceled), optional target date, and can contain milestones.
# Projects are workspace-level and can span multiple teams.
# ------------------------------------------------------------

# Project list fields fragment
#
# Fields returned for each project in list results. Includes status,
# priority, lead, teams, labels, health, and progress for rich output.
# Retains deprecated `state` field for backward compatibility.
#
# Nested connections are explicitly bounded: Linear's complexity
# estimator charges an unbounded connection at its default page size
# (50) per parent row, which pushed the default `projects list`
# (first: 100) to ~13950 against a 10000 budget — the "Query too
# complex" error in #276. Bounds of 25 keep the same query at ~7450.
fragment ProjectListFields on Project {
  id
  name
  description
  state
  status {
    id
    name
    type
  }
  slugId
  priority
  priorityLabel
  health
  progress
  startDate
  targetDate
  url
  lead {
    id
    name
  }
  teams(first: 25) {
    nodes {
      id
      key
      name
    }
  }
  labels(first: 25) {
    nodes {
      id
      name
      color
    }
  }
}

# Project detail fields fragment
#
# Extended fields for single-project read view. Includes content,
# members, milestones, initiatives, creator, lifecycle dates, and
# visual properties.
#
# Every bounded connection selects pageInfo.hasNextPage here so a
# truncated page is detectable. The teams/labels re-selections merge
# with ProjectListFields (identical first: arguments), adding the
# truncation signal only in detail/mutation contexts: pageInfo prices
# at ~23 complexity per parent row, which is negligible on a single
# project but would put the 100-row list back over the 10000 budget.
fragment ProjectDetailFields on Project {
  ...ProjectListFields
  teams(first: 25) {
    pageInfo {
      hasNextPage
    }
  }
  labels(first: 25) {
    pageInfo {
      hasNextPage
    }
  }
  content
  icon
  color
  createdAt
  updatedAt
  startedAt
  completedAt
  canceledAt
  creator {
    id
    name
  }
  members(first: 25) {
    nodes {
      id
      name
    }
    pageInfo {
      hasNextPage
    }
  }
  initiatives(first: 25) {
    nodes {
      id
      name
    }
    pageInfo {
      hasNextPage
    }
  }
  # The project's `health` is derived from its latest status update, so the
  # read that reports the health also reports where it came from.
  healthUpdatedAt
  lastUpdate {
    id
    health
    body
    createdAt
  }
}

fragment ProjectDetailWithDefaultConnectionsFields on Project {
  ...ProjectDetailFields
  projectMilestones(first: 25) {
    nodes {
      id
      name
      targetDate
    }
    pageInfo {
      hasNextPage
    }
  }
}

# List all projects in the workspace
#
# Fetches a paginated list of projects across all teams with enriched
# fields including status, priority, lead, teams, labels, health.
#
# Variables:
#   $first: Maximum number of projects to return (default: 50)
#   $after: Cursor for pagination
#   $includeArchived: Include archived projects
query GetProjects($first: Int = 50, $after: String, $includeArchived: Boolean) {
  projects(first: $first, after: $after, includeArchived: $includeArchived) {
    nodes {
      ...ProjectListFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Project detail fields for opt-in reaction-aware reads
#
# Root project reactions are intentionally unsupported by the current schema.
# Keep the opt-in variant explicit for callers without changing the core
# project contract. Only paginated root discussion comments are included here
# with reactions and pageInfo. Replies are intentionally excluded and must be
# fetched via the dedicated project discussion queries.
fragment ProjectDetailFieldsWithReactions on Project {
  ...ProjectDetailFields
  comments(first: $first, after: $after, filter: { parent: { null: true } }) {
    nodes {
      ...DiscussionCommentFieldsWithReactions
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Get a single project by ID
#
# Fetches complete project details including content, members,
# milestones, initiatives, and lifecycle timestamps.
#
# Variables:
#   $id: Project UUID
#   $milestonesFirst: Maximum number of milestones to return
#   $skipMilestones: Omit projectMilestones from the response
#   $issuesFirst: Maximum number of issues to return
#   $skipIssues: Omit issues from the response
query GetProject(
  $id: String!
  $milestonesFirst: Int!
  $skipMilestones: Boolean!
  $issuesFirst: Int!
  $skipIssues: Boolean!
) {
  project(id: $id) {
    ...ProjectDetailFields
    projectMilestones(first: $milestonesFirst) @skip(if: $skipMilestones) {
      nodes {
        id
        name
        description
        targetDate
        sortOrder
      }
    }
    issues(first: $issuesFirst) @skip(if: $skipIssues) {
      nodes {
        ...CompleteIssueFields
      }
    }
  }
}

# Get a single project by ID for opt-in reaction-aware reads
#
# Includes only paginated root discussion comments with reactions. Replies are
# intentionally excluded here and must come from dedicated discussion queries.
query GetProjectWithReactions($id: String!, $first: Int, $after: String) {
  project(id: $id) {
    ...ProjectDetailFieldsWithReactions
  }
}

# Full-text search across projects
#
# Ranked by relevance rather than by `updatedAt`, so there is no orderBy
# knob here — asking for one would silently discard the ranking that
# makes the search worth running.
#
# `searchProjects` is rate-limited more tightly than the plain
# `projects` connection; use `projects list` when a filter would do.
# The search fields, mirroring ProjectListFields
#
# `searchProjects` returns `ProjectSearchResult`, a sibling type of
# `Project` rather than the thing itself, so the list fragment cannot be
# reused. Two differences are real: `state` (deprecated on `Project`) does
# not exist here, and `metadata` carries the search-ranking detail.
fragment ProjectSearchFields on ProjectSearchResult {
  id
  name
  description
  status {
    id
    name
    type
  }
  slugId
  priority
  priorityLabel
  health
  progress
  startDate
  targetDate
  url
  metadata
  lead {
    id
    name
  }
  teams(first: 25) {
    nodes {
      id
      key
      name
    }
  }
  labels(first: 25) {
    nodes {
      id
      name
      color
    }
  }
}

query SearchProjects(
  $term: String!
  $first: Int = 25
  $after: String
  $includeArchived: Boolean = false
  $teamId: String
) {
  searchProjects(
    term: $term
    first: $first
    after: $after
    includeArchived: $includeArchived
    teamId: $teamId
  ) {
    nodes {
      ...ProjectSearchFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# List all project statuses in the workspace
#
# Fetches project statuses for name-to-UUID resolution.
# The API does not support filter args on this connection,
# so all statuses are fetched and filtered client-side.
query GetProjectStatuses($includeArchived: Boolean = false) {
  projectStatuses(includeArchived: $includeArchived) {
    nodes {
      id
      name
    }
  }
}

# Find projects by case-insensitive name for ID resolution
#
# Returns up to two matches so the resolver can throw on ambiguity.
# includeArchived is passed through to preserve archive-aware lookups.
query FindProjectsByName($name: String!, $includeArchived: Boolean) {
  projects(
    filter: { name: { eqIgnoreCase: $name } }
    first: 2
    includeArchived: $includeArchived
  ) {
    nodes {
      id
    }
  }
}
