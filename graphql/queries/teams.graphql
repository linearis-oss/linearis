# ------------------------------------------------------------
# GraphQL queries for Linear teams
#
# Teams are organizational units that own issues, cycles, and statuses.
# Each team has a unique key (e.g., "ENG", "DESIGN") used for issue
# identifiers (e.g., ENG-123). Teams serve as the primary scoping
# mechanism for most Linear entities.
#
# Key behavior: Teams are workspace-level entities. All users see all
# teams, but permission controls determine which teams users can
# create issues in or modify.
# ------------------------------------------------------------

# Team fields fragment
#
# Defines the basic fields for a team entity. The key is used in
# issue identifiers (TEAM-123), and the name is the display name.
fragment TeamFields on Team {
  id
  key
  name
}

fragment TeamDetailFields on Team {
  id
  key
  name
  description
  private
  timezone
  color
  icon
  issueCount
  parent {
    id
    key
    name
  }
  issueEstimationType
  issueEstimationExtended
  issueEstimationAllowZero
  defaultIssueEstimate
  inheritIssueEstimation
  cyclesEnabled
  cycleDuration
  cycleCooldownTime
  cycleStartDay
  upcomingCycleCount
  triageEnabled
  requirePriorityToLeaveTriage
  autoClosePeriod
  autoArchivePeriod
  autoCloseChildIssues
  autoCloseParentIssues
}

# List all teams in the workspace
#
# Fetches a list of all teams. Teams are typically limited in number
# (most workspaces have < 50), so pagination is rarely needed.
#
# Variables:
#   $first: Maximum number of teams to return (default: 50)
query GetTeams($first: Int = 50, $after: String) {
  teams(first: $first, after: $after) {
    nodes {
      ...TeamFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query GetTeamById($id: String!) {
  team(id: $id) {
    ...TeamDetailFields
  }
}

# Lean fields for team ID/estimate resolution
#
# Covers both resolveTeamId (id only) and resolveTeamEstimateContext
# (id, key, name plus the estimation fields) without over-fetching the
# heavy TeamDetailFields fragment.
fragment TeamLookupFields on Team {
  id
  key
  name
  issueEstimationType
  issueEstimationExtended
  issueEstimationAllowZero
}

# Find teams by an arbitrary filter for resolver lookups
#
# The filter is supplied dynamically so callers can preserve the
# key-first-then-name lookup order (two calls) and the id/key/name
# estimate lookups with a single operation.
query FindTeams($filter: TeamFilter, $first: Int = 1) {
  teams(filter: $filter, first: $first) {
    nodes {
      ...TeamLookupFields
    }
  }
}

# Team membership fields fragment
#
# A membership joins a user to a team. The membership id is required to
# delete the membership; owner marks a team admin.
fragment TeamMembershipFields on TeamMembership {
  id
  owner
  user {
    id
    name
    email
    displayName
  }
}

# List a team's memberships
#
# Used by `teams members` and to resolve a membership id from a
# team + user pair for `teams remove-member`. Paginated by the service
# layer so all members are fetched regardless of team size.
query GetTeamMemberships($id: String!, $first: Int = 250, $after: String) {
  team(id: $id) {
    id
    memberships(first: $first, after: $after) {
      nodes {
        ...TeamMembershipFields
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
