query ListIssueDiscussionReplyCandidates(
  $issueId: ID!
  $first: Int
  $after: String
) {
  comments(
    first: $first
    after: $after
    orderBy: createdAt
    filter: { issue: { id: { eq: $issueId } }, parent: { null: false } }
  ) {
    nodes {
      ...DiscussionCommentFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

