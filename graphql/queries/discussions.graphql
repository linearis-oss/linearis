fragment DiscussionCommentFields on Comment {
  id
  body
  createdAt
  editedAt
  parentId
  resolvedAt
  resolvingComment {
    id
  }
  resolvingUser {
    id
    displayName
  }
  user {
    id
    displayName
  }
}

fragment DiscussionCommentFieldsWithReactions on Comment {
  ...DiscussionCommentFields
  reactions {
    ...ReactionReadFields
  }
}

query GetDiscussionCommentContext($id: String!) {
  comment(id: $id) {
    ...DiscussionCommentFields
    issueId
    projectId
    initiativeId
  }
}

query ListIssueDiscussionRoots($issueId: String!, $first: Int, $after: String) {
  issue(id: $issueId) {
    comments(first: $first, after: $after, filter: { parent: { null: true } }) {
      nodes {
        ...DiscussionCommentFields
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

query ListIssueDiscussionRootsWithReactions(
  $issueId: String!
  $first: Int
  $after: String
) {
  issue(id: $issueId) {
