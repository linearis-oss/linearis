query ListInitiativeDiscussionRoots(
  $initiativeId: ID!
  $initiativeLookupId: String!
  $first: Int
  $after: String
) {
  initiative: initiative(id: $initiativeLookupId) {
    id
  }
  comments(
    first: $first
    after: $after
    filter: {
      initiative: { id: { eq: $initiativeId } }
      parent: { null: true }
    }
  ) {
    nodes {
      ...DiscussionCommentFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

